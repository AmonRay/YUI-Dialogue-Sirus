name: Sirus release

# Every change of "## Version:" in DialogueUI.toc pushed to main =
# a new GitHub Release v<version> with DialogueUI-<version>-sirus.zip.
# The archive holds a single DialogueUI/ folder for Interface/AddOns.
# Before packaging, scripts/convert_textures_335.py brings every texture in
# Art/ to the 3.3.5a layout (BLP, power-of-two size, full mip chain). Files
# it rebuilds are committed back to main, so the repository and the archive
# always hold the same textures.
# Self-contained: no secrets, no third-party actions (only actions/checkout,
# actions/setup-python, Pillow from PyPI, the preinstalled zip and the gh CLI).

on:
  push:
    branches: [main]
    paths:
      - DialogueUI.toc
      - scripts/convert_textures_335.py
      - .github/workflows/sirus-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sirus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Textures for 3.3.5a
        id: tex
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pillow
          python scripts/convert_textures_335.py
          if [ -n "$(git status --porcelain -- Art Code/Compat/TextureSizes_335.lua)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add -A -- Art Code/Compat/TextureSizes_335.lua
            git commit -q -m "335: textures rebuilt by scripts/convert_textures_335.py (BLP with mip levels)"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push the rebuilt textures to main"
              exit 1
            fi
            echo "::notice::Rebuilt textures committed to main as $(git rev-parse --short HEAD)"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read version from TOC
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW="$(sed -n 's/^## Version:[[:space:]]*//p' DialogueUI.toc | tr -d '\r' | head -n 1)"
          VERSION="$(printf '%s' "$RAW" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/[[:space:]]\{1,\}/-/g')"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error file=DialogueUI.toc::No '## Version:' line"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists - recreating it from this commit."
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build archive
        id: pkg
        if: steps.ver.outputs.skip == 'false'
        run: bash scripts/package-sirus.sh "${{ steps.ver.outputs.version }}"

      - name: Check archive layout
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          ZIP="${{ steps.pkg.outputs.zip_path }}"
          ROOTS="$(unzip -Z1 "$ZIP" | cut -d/ -f1 | sort -u)"
          echo "Top-level entries: ${ROOTS}"
          [ "${ROOTS}" = "DialogueUI" ]
          unzip -Z1 "$ZIP" | grep -qx 'DialogueUI/DialogueUI.toc'
          unzip -Z1 "$ZIP" | grep -qx 'DialogueUI/Code/Compat/Compat_335.lua'

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          NUM="${TAG#v}"
          # Notes: the "## [NUM]" section of CHANGELOG.md, if there is one.
          if [ -f CHANGELOG.md ]; then
            tr -d '\r' < CHANGELOG.md | awk -v v="$NUM" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' > release-notes.md
          else
            : > release-notes.md
          fi
          {
            echo "Backport of Dialogue UI for WoW 3.3.5a (Sirus interface patch)."
            echo
            echo "Unpack into \`World of Warcraft/Interface/AddOns\` - the archive contains a single \`DialogueUI\` folder."
          } >> release-notes.md
          gh release create "$TAG" "${{ steps.pkg.outputs.zip_path }}" \
            --target "${{ steps.tex.outputs.sha }}" \
            --title "DialogueUI ${TAG} (Sirus)" \
            --notes-file release-notes.md \
            --latest
